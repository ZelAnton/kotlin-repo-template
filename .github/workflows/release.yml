name: Release

# Manual, opt-in publish to Maven Central via the Sonatype Central Portal.
#
# Required repository secrets (see TEMPLATE.md "Publishing to Maven Central"):
#   MAVEN_CENTRAL_USERNAME  - Central Portal user token name
#   MAVEN_CENTRAL_PASSWORD  - Central Portal user token password
#   SIGNING_KEY             - ASCII-armored GPG private key
#   SIGNING_PASSWORD        - passphrase for that key
#
# Delete this workflow (and the publishing/signing blocks in build.gradle.kts)
# if the project is an app or internal-only library.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0), without a leading v'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        # publishToMavenCentral uploads to a staging deployment you release from
        # the Central Portal UI. Swap for publishAndReleaseToMavenCentral to auto-release.
        run: ./gradlew publishToMavenCentral -Pversion=${{ github.event.inputs.version }} --stacktrace

      - name: Tag the release
        run: |
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          generate_release_notes: true
          files: |
            build/libs/*.jar
