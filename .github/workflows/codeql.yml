name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 5 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # CodeQL's Kotlin extractor caps the Kotlin versions it will analyse and
      # lags new Kotlin releases by weeks: a Kotlin even one patch newer than the
      # bundled extractor supports is rejected, and the run fails with "no source
      # code seen during build". Raise the cap to exactly the version this project
      # uses (read from the catalog so it tracks the real version) — a patch bump
      # keeps the Kotlin compiler-plugin API compatible, so extraction still works.
      # If a future Kotlin *minor* breaks extraction outright, drop the workflow
      # until CodeQL ships support, or pin Kotlin to a supported release for CI.
      - name: Raise CodeQL Kotlin version cap to the project's Kotlin
        run: |
          kv=$(grep -E '^kotlin[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$kv" ]; then
            echo "Could not read the Kotlin version from gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "Project Kotlin version: $kv"
          echo "CODEQL_EXTRACTOR_KOTLIN_OVERRIDE_MAXIMUM_VERSION_LIMIT=$kv" >> "$GITHUB_ENV"

      # GitHub CodeQL analyses Kotlin through its java-kotlin pack.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d77b13a0df3134d64a457ea9003f600b09fa1c8a # v3
        with:
          languages: java-kotlin
          queries: security-and-quality
          build-mode: manual

      # --no-build-cache forces the Kotlin compiler to actually run under CodeQL's
      # build tracer; a cache/UP-TO-DATE hit would skip kotlinc and again leave
      # CodeQL with "no source code seen".
      - name: Build
        run: ./gradlew assemble --no-build-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d77b13a0df3134d64a457ea9003f600b09fa1c8a # v3
        with:
          category: "/language:java-kotlin"
