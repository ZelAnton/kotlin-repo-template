name: Dependency submission

# Submits the resolved Gradle dependency graph to GitHub's Dependency Graph, so
# Dependabot security alerts cover transitive dependencies too (not just the
# direct ones declared in gradle/libs.versions.toml).
#
# Prerequisite: the repository's Dependency graph feature must be enabled, or
# every run fails with "The Dependency graph is disabled for this repository."
# It is on by default for public repositories and opt-in for private ones:
# Settings > Code security > Dependency graph, or enable Dependabot alerts
# (which switches the graph on as well) with
#   gh api -X PUT repos/OWNER/REPO/vulnerability-alerts

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
