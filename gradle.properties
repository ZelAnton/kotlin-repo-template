# Kotlin official code style (read by the IDE and ktlint).
kotlin.code.style=official

# Build performance. Parallel execution and the build cache are safe with any
# plugin. The configuration cache is left OFF by default: it is the strictest
# Gradle feature and some third-party plugins are not yet compatible with it.
# Turn it on once you've confirmed every plugin you use supports it:
#   org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
